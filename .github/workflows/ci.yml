name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC, no token secret
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: Typecheck (with time budget)
        run: timeout 120 pnpm typecheck
      - name: Tests (with coverage thresholds)
        run: pnpm coverage
      - name: Upload coverage
        if: matrix.node == 24
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/lcov.info
          fail_ci_if_error: false
      - run: pnpm build
      - name: Packed tarball installs and type-checks in a consumer project
        run: pnpm smoke
      - name: Test Studio builds against the source
        if: matrix.node == 24
        run: pnpm --filter sanity-plugin-maplibre-dev build
