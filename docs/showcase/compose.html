<!doctype html>
<!--
  Lays out the README screenshots on a shared background for presentation.
  Serve the repo root (python3 -m http.server 3335), open /docs/showcase/compose.html
  and capture each <section> at 2x. The source screenshots in docs/ aren't changed.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Showcase compositions</title>
    <style>
      :root {
        --bg: #e8e4dd;
        --radius: 12px;
        --hairline: rgba(0, 0, 0, 0.1);
        --lift:
          0 1px 2px rgba(40, 30, 20, 0.06), 0 8px 24px rgba(40, 30, 20, 0.08), 0 28px 56px -16px rgba(40, 30, 20, 0.16);
        --chrome: #f4f2ee;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #fff;
        font:
          13px/1 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Inter,
          sans-serif;
      }
      section {
        position: relative;
        background: var(--bg);
        overflow: hidden;
        margin: 0 0 40px;
      }

      /* A screenshot as a card: rounded, with a hairline edge and a soft lift. */
      .card {
        position: absolute;
        display: block;
        border-radius: var(--radius);
        box-shadow:
          0 0 0 1px var(--hairline),
          var(--lift);
        overflow: hidden;
        background: #fff;
      }
      .card img {
        display: block;
        width: 100%;
        height: auto;
      }

      /* A window: the card plus a title bar with grey traffic lights and an address pill. */
      .window .bar {
        height: 40px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
        background: var(--chrome);
        border-bottom: 1px solid var(--hairline);
        position: relative;
      }
      .window .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #d6d2cb;
      }
      .window .address {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 48px;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 0 0 1px var(--hairline);
        color: #6b6760;
      }

      #hero {
        width: 1440px;
        height: 952px;
      }
      #hero .window {
        left: 80px;
        top: 72px;
        width: 1280px;
      }

      /* Pairs: the field behind at the top left, its dialog in front at the bottom right. */
      .pair {
        width: 1280px;
        height: 880px;
      }
      .pair .field {
        left: 72px;
        top: 72px;
        width: 626px;
      }
      .pair .dialog {
        right: 72px;
        top: 120px;
        width: 614px;
        z-index: 1;
      }

      #review {
        width: 640px;
        height: 640px;
      }
      #review .card {
        left: 50%;
        top: 50%;
        width: 404px;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    <section id="hero">
      <div class="card window">
        <div class="bar">
          <span class="dot"></span><span class="dot"></span><span class="dot"></span>
          <span class="address">localhost:3333/structure/place</span>
        </div>
        <img src="../studio.png" alt="" />
      </div>
    </section>

    <section id="field-and-search" class="pair">
      <div class="card dialog"><img src="../search.png" alt="" /></div>
      <div class="card field"><img src="../geopoint-input.png" alt="" /></div>
    </section>

    <section id="radius-and-dialog" class="pair">
      <div class="card dialog"><img src="../radius-dialog.png" alt="" /></div>
      <div class="card field"><img src="../radius-input.png" alt="" /></div>
    </section>

    <section id="review">
      <div class="card"><img src="../review-changes.png" alt="" /></div>
    </section>
  </body>
</html>
